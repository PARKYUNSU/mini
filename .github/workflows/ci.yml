# mini 저장소 루트 기준 — 외부 API 없이 unit+integration만 실행
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check agent env imports
        run: python scripts/check_agent_env.py -q

      - name: Pytest (unit + integration, external 제외)
        run: pytest tests/ -m "not external" -q
