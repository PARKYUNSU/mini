# 라우팅 회귀 테스트 Golden Cases
# input → expected_search_intent, expected_tool (use_existing_tool 시)
# expected_tool: null = Tavily 아님 (direct_answer 또는 다른 도구)

# === Tavily로 가야 하는 문장 ===
- input: "오늘 IT 뉴스 알려줘"
  expected_search_intent: web
  expected_tool: tavily_search_tool

- input: "최신 AI 뉴스 검색해줘"
  expected_search_intent: web
  expected_tool: tavily_search_tool

- input: "인터넷에서 애플 실리콘 M4 기사 찾아줘"
  expected_search_intent: web
  expected_tool: tavily_search_tool

# === Tavily로 가면 안 되는 문장 ===
- input: "최신 논문 목록 보여줘"
  expected_search_intent: rag
  expected_tool: chromadb_db_inventory

- input: "논문 검색해줘"
  expected_search_intent: rag
  expected_tool: null

- input: "chromadb에 저장된 논문 뭐 있어?"
  expected_search_intent: rag
  expected_tool: chromadb_db_inventory

- input: "저장된 도구 목록 검색해줘"
  expected_search_intent: tool
  expected_tool: null  # Tavily 금지, 도구 선택은 LLM에 위임

- input: "JOB-A1B2 자세히 보여줘"
  expected_search_intent: tool
  expected_tool: schedule_show_job

- input: "delete JOB-A1B2"
  expected_search_intent: tool
  expected_tool: schedule_delete_job

- input: "edit JOB-A1B2 time 09:00"
  expected_search_intent: tool
  expected_tool: schedule_edit_job

- input: "edit JOB-A1B2 prompt 오늘 IT 뉴스 요약"
  expected_search_intent: tool
  expected_tool: schedule_edit_job
